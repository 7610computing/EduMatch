<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduMatch - Schools Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="css/map.css">
</head>

<body>

    <!-- =========================
         UNIVERSAL NAVBAR
         ========================= -->

    <div data-universal="navbar"></div>


    <main class="map-page">

        <!-- =========================
             LOCATION + SCHOOL SEARCH
             ========================= -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="school-search"
                    placeholder="Search for a school..."
                    autocomplete="off"
                >

            </div>

            <button
                id="search-button"
                class="search-button"
                type="button"
            >
                Search
            </button>

        </section>


        <!-- USER LOCATION -->

        <section class="location-section">

            <div class="location-input">

                <span class="location-icon">
                    ●
                </span>

                <input
                    type="text"
                    id="location-input"
                    placeholder="Enter your location..."
                    autocomplete="street-address"
                >

            </div>

            <button
                id="current-location-button"
                class="current-location-button"
                type="button"
            >
                Current Location
            </button>

        </section>


        <!-- =========================
             FILTER PANEL
             ========================= -->

        <section class="filter-panel">

            <div class="filter-header">

                <div>
                    <h2>Filters</h2>

                    <p>
                        Refine the schools shown on the map.
                    </p>
                </div>

                <button
                    id="clear-filters"
                    class="clear-filters"
                    type="button"
                >
                    Clear filters
                </button>

            </div>


            <!-- =========================
                 DROPDOWN FILTERS
                 ========================= -->

            <div class="select-filters">


                <!-- STATE -->

                <div class="filter-field">

                    <label>
                        State / Province / Region
                    </label>

                    <div class="search-select">

                        <input
                            type="text"
                            id="state-filter"
                            placeholder="Search worldwide..."
                            autocomplete="off"
                        >

                        <div
                            id="state-options"
                            class="search-options"
                        ></div>

                    </div>

                    <div
                        id="selected-states"
                        class="selected-items"
                    ></div>

                </div>


                <!-- SECTOR -->

                <div class="filter-field">

                    <label>
                        Sector
                    </label>

                    <div
                        id="sector-dropdown"
                        class="checkbox-dropdown"
                    >

                        <button
                            id="sector-dropdown-button"
                            class="dropdown-button"
                            type="button"
                        >
                            <span>
                                Select sector
                            </span>

                            <span>
                                ▾
                            </span>
                        </button>

                        <div
                            id="sector-options"
                            class="checkbox-options"
                        >

                            <label>
                                <input
                                    type="checkbox"
                                    value="Public"
                                    data-filter="sector"
                                >
                                <span>Public</span>
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    value="Private"
                                    data-filter="sector"
                                >
                                <span>Private</span>
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    value="Catholic"
                                    data-filter="sector"
                                >
                                <span>Catholic</span>
                            </label>

                        </div>

                    </div>

                </div>


                <!-- GENDER -->

                <div class="filter-field">

                    <label>
                        Gender
                    </label>

                    <div
                        id="gender-dropdown"
                        class="checkbox-dropdown"
                    >

                        <button
                            id="gender-dropdown-button"
                            class="dropdown-button"
                            type="button"
                        >
                            <span>
                                Select gender
                            </span>

                            <span>
                                ▾
                            </span>
                        </button>

                        <div
                            id="gender-options"
                            class="checkbox-options"
                        >

                            <label>
                                <input
                                    type="checkbox"
                                    value="Male"
                                    data-filter="gender"
                                >
                                <span>Male</span>
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    value="Female"
                                    data-filter="gender"
                                >
                                <span>Female</span>
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    value="Other"
                                    data-filter="gender"
                                >
                                <span>Other</span>
                            </label>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================
                 RANGE FILTERS
                 ========================= -->

            <div class="range-filters">


                <!-- AGE -->

                <div class="range-filter">

                    <h3>Age</h3>

                    <div class="range-inputs">

                        <div>
                            <label>Min</label>

                            <input
                                type="number"
                                id="age-min"
                                min="3"
                                max="25"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label>Max</label>

                            <input
                                type="number"
                                id="age-max"
                                min="3"
                                max="25"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="age-slider-min"
                            min="3"
                            max="25"
                            value="3"
                            step="1"
                        >

                        <input
                            type="range"
                            id="age-slider-max"
                            min="3"
                            max="25"
                            value="25"
                            step="1"
                        >

                    </div>

                </div>


                <!-- FEES -->

                <div class="range-filter">

                    <h3>Fees</h3>

                    <div class="range-inputs">

                        <div>
                            <label>Min</label>

                            <input
                                type="number"
                                id="fee-min"
                                min="0"
                                max="100000"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label>Max</label>

                            <input
                                type="number"
                                id="fee-max"
                                min="0"
                                max="100000"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="fee-slider-min"
                            min="0"
                            max="100000"
                            value="0"
                            step="500"
                        >

                        <input
                            type="range"
                            id="fee-slider-max"
                            min="0"
                            max="100000"
                            value="100000"
                            step="500"
                        >

                    </div>

                </div>


                <!-- ENROLMENT -->

                <div class="range-filter">

                    <h3>Enrolment</h3>

                    <div class="range-inputs">

                        <div>
                            <label>Min</label>

                            <input
                                type="number"
                                id="enrolment-min"
                                min="0"
                                max="5000"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label>Max</label>

                            <input
                                type="number"
                                id="enrolment-max"
                                min="0"
                                max="5000"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="enrolment-slider-min"
                            min="0"
                            max="5000"
                            value="0"
                            step="50"
                        >

                        <input
                            type="range"
                            id="enrolment-slider-max"
                            min="0"
                            max="5000"
                            value="5000"
                            step="50"
                        >

                    </div>

                </div>


                <!-- STUDENT TEACHER RATIO -->

                <div class="range-filter">

                    <h3>
                        Student–Teacher Ratio
                    </h3>

                    <div class="range-inputs">

                        <div>
                            <label>Min</label>

                            <input
                                type="number"
                                id="ratio-min"
                                min="1"
                                max="50"
                                step="0.1"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label>Max</label>

                            <input
                                type="number"
                                id="ratio-max"
                                min="1"
                                max="50"
                                step="0.1"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="ratio-slider-min"
                            min="1"
                            max="50"
                            value="1"
                            step="0.1"
                        >

                        <input
                            type="range"
                            id="ratio-slider-max"
                            min="1"
                            max="50"
                            value="50"
                            step="0.1"
                        >

                    </div>

                </div>


                <!-- DISTANCE -->

                <div class="range-filter">

                    <h3>
                        Distance
                    </h3>

                    <div class="range-inputs">

                        <div>
                            <label>Min (km)</label>

                            <input
                                type="number"
                                id="distance-min"
                                min="0"
                                max="100"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label>Max (km)</label>

                            <input
                                type="number"
                                id="distance-max"
                                min="0"
                                max="100"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="distance-slider-min"
                            min="0"
                            max="100"
                            value="0"
                            step="1"
                        >

                        <input
                            type="range"
                            id="distance-slider-max"
                            min="0"
                            max="100"
                            value="100"
                            step="1"
                        >

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             RESULTS
             ========================= -->

        <div class="results-bar">

            <span id="results-count">
                Loading schools...
            </span>

        </div>


        <!-- =========================
             MAP
             ========================= -->

        <section class="map-workspace">

            <div
                id="school-map"
                class="school-map"
            ></div>


            <!-- DETAILS PANEL -->

            <aside
                id="school-details"
                class="school-details"
            >

                <button
                    id="close-details"
                    class="close-details"
                    type="button"
                >
                    ×
                </button>

                <div
                    id="school-details-content"
                    class="school-details-content"
                >

                    <div class="details-empty">

                        <div class="details-icon">
                            +
                        </div>

                        <h2>
                            Select a school
                        </h2>

                        <p>
                            Select a school on the map
                            to view more information.
                        </p>

                    </div>

                </div>

            </aside>

        </section>

    </main>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="js/universal.js"></script>

    <script src="js/map.js"></script>

</body>

</html>
