<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduMatch - Schools Map</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Map CSS -->
    <link rel="stylesheet" href="css/map.css">
</head>

<body>

    <!-- =========================
         UNIVERSAL NAVBAR
         ========================= -->

    <div data-universal="navbar"></div>


    <!-- =========================
         PAGE
         ========================= -->

    <main class="map-page">

        <!-- =========================
             SEARCH
             ========================= -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="school-search"
                    placeholder="Search for a school..."
                    autocomplete="off"
                >

            </div>

            <button
                id="search-button"
                class="search-button"
                type="button"
            >
                Search
            </button>

        </section>


        <!-- =========================
             FILTERS
             ========================= -->

        <section class="filter-panel">

            <div class="filter-header">

                <div>
                    <h2>Filters</h2>
                    <p>Refine the schools shown on the map.</p>
                </div>

                <button
                    id="clear-filters"
                    class="clear-filters"
                    type="button"
                >
                    Clear filters
                </button>

            </div>


            <!-- =========================
                 SEARCHABLE FILTERS
                 ========================= -->

            <div class="select-filters">

                <!-- State -->
                <div class="filter-field">

                    <label for="state-filter">
                        State / Province / Region
                    </label>

                    <div class="search-select">

                        <input
                            type="text"
                            id="state-filter"
                            placeholder="Search worldwide..."
                            autocomplete="off"
                        >

                        <div
                            id="state-options"
                            class="search-options"
                        ></div>

                    </div>

                    <div
                        id="selected-states"
                        class="selected-items"
                    ></div>

                </div>


                <!-- Sector -->
                <div class="filter-field">

                    <label for="sector-filter">
                        Sector
                    </label>

                    <div class="search-select">

                        <input
                            type="text"
                            id="sector-filter"
                            placeholder="Search worldwide..."
                            autocomplete="off"
                        >

                        <div
                            id="sector-options"
                            class="search-options"
                        ></div>

                    </div>

                    <div
                        id="selected-sectors"
                        class="selected-items"
                    ></div>

                </div>

            </div>


            <!-- =========================
                 RANGE FILTERS
                 ========================= -->

            <div class="range-filters">


                <!-- AGE -->
                <div class="range-filter">

                    <div class="range-title">
                        <h3>Age</h3>
                    </div>

                    <div class="range-inputs">

                        <div>
                            <label for="age-min">Min</label>

                            <input
                                type="number"
                                id="age-min"
                                min="0"
                                max="100"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label for="age-max">Max</label>

                            <input
                                type="number"
                                id="age-max"
                                min="0"
                                max="100"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="age-slider-min"
                            min="0"
                            max="100"
                            value="0"
                            step="1"
                        >

                        <input
                            type="range"
                            id="age-slider-max"
                            min="0"
                            max="100"
                            value="100"
                            step="1"
                        >

                    </div>

                </div>


                <!-- FEES -->
                <div class="range-filter">

                    <div class="range-title">
                        <h3>Fees</h3>
                    </div>

                    <div class="range-inputs">

                        <div>
                            <label for="fee-min">Min</label>

                            <input
                                type="number"
                                id="fee-min"
                                min="0"
                                step="1"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label for="fee-max">Max</label>

                            <input
                                type="number"
                                id="fee-max"
                                min="0"
                                step="1"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="fee-slider-min"
                            min="0"
                            max="100000"
                            value="0"
                            step="100"
                        >

                        <input
                            type="range"
                            id="fee-slider-max"
                            min="0"
                            max="100000"
                            value="100000"
                            step="100"
                        >

                    </div>

                </div>


                <!-- ENROLMENT -->
                <div class="range-filter">

                    <div class="range-title">
                        <h3>Enrolment</h3>
                    </div>

                    <div class="range-inputs">

                        <div>
                            <label for="enrolment-min">Min</label>

                            <input
                                type="number"
                                id="enrolment-min"
                                min="0"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label for="enrolment-max">Max</label>

                            <input
                                type="number"
                                id="enrolment-max"
                                min="0"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="enrolment-slider-min"
                            min="0"
                            max="10000"
                            value="0"
                            step="10"
                        >

                        <input
                            type="range"
                            id="enrolment-slider-max"
                            min="0"
                            max="10000"
                            value="10000"
                            step="10"
                        >

                    </div>

                </div>


                <!-- STUDENT TEACHER RATIO -->
                <div class="range-filter">

                    <div class="range-title">
                        <h3>Student–Teacher Ratio</h3>
                    </div>

                    <div class="range-inputs">

                        <div>
                            <label for="ratio-min">Min</label>

                            <input
                                type="number"
                                id="ratio-min"
                                min="0"
                                step="0.1"
                                placeholder="Any"
                            >
                        </div>

                        <div>
                            <label for="ratio-max">Max</label>

                            <input
                                type="number"
                                id="ratio-max"
                                min="0"
                                step="0.1"
                                placeholder="Any"
                            >
                        </div>

                    </div>

                    <div class="dual-slider">

                        <div class="slider-track"></div>

                        <input
                            type="range"
                            id="ratio-slider-min"
                            min="0"
                            max="100"
                            value="0"
                            step="0.1"
                        >

                        <input
                            type="range"
                            id="ratio-slider-max"
                            min="0"
                            max="100"
                            value="100"
                            step="0.1"
                        >

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             RESULTS COUNT
             ========================= -->

        <div class="results-bar">

            <span id="results-count">
                Loading schools...
            </span>

        </div>


        <!-- =========================
             MAP
             ========================= -->

        <section class="map-workspace">

            <div
                id="school-map"
                class="school-map"
            ></div>


            <!-- =========================
                 SCHOOL DETAILS
                 ========================= -->

            <aside
                id="school-details"
                class="school-details"
            >

                <button
                    id="close-details"
                    class="close-details"
                    type="button"
                    aria-label="Close school details"
                >
                    ×
                </button>

                <div
                    id="school-details-content"
                    class="school-details-content"
                >

                    <div class="details-empty">

                        <div class="details-icon">
                            +
                        </div>

                        <h2>Select a school</h2>

                        <p>
                            Select a school on the map to view
                            more information.
                        </p>

                    </div>

                </div>

            </aside>

        </section>

    </main>


    <!-- =========================
         LEAFLET
         ========================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- =========================
         UNIVERSAL LOADER
         ========================= -->

    <script src="js/universal.js"></script>


    <!-- =========================
         MAP JAVASCRIPT
         ========================= -->

    <script src="js/map.js"></script>

</body>

</html>
