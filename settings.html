<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - EduMatch</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- UNIVERSAL NAVBAR -->
    <div data-universal="navbar"></div>

    <main class="login-container" style="max-width: 600px; margin: 40px auto; min-height: auto;">
        <section class="login-box" style="width: 100%; max-width: 100%;">
            <h2>Account Settings</h2>
            <p class="login-description">Manage your profile information, email address, and security credentials.</p>

            <!-- PROFILE SECTION -->
            <form id="profile-form">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 1.1rem;">Profile Information</h3>
                
                <div class="form-group">
                    <label for="settings-fullname">Full Name</label>
                    <input type="text" id="settings-fullname" required>
                </div>

                <div class="form-group">
                    <label for="settings-account-type">Account Type</label>
                    <select id="settings-account-type" required>
                        <option value="student">Student</option>
                        <option value="parent">Parent</option>
                    </select>
                </div>

                <button type="submit" id="profile-button">Update Profile</button>
                <p id="profile-message" class="settings-message"></p>
            </form>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eaeaea;">

            <!-- EMAIL SECTION -->
            <form id="email-form">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 1.1rem;">Change Email Address</h3>
                
                <div class="form-group">
                    <label for="settings-email">Email Address</label>
                    <input type="email" id="settings-email" required>
                </div>

                <button type="submit" id="email-button">Update Email</button>
                <p id="email-message" class="settings-message"></p>
            </form>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eaeaea;">

            <!-- PASSWORD SECTION -->
            <form id="password-form">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 1.1rem;">Reset Password</h3>
                
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="At least 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" placeholder="Confirm new password" minlength="6" required>
                </div>

                <button type="submit" id="password-button">Update Password</button>
                <p id="password-message" class="settings-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>EduMatch</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/universal.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
