<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduMatch - Saved Schools</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            min-height: 100vh;
        }

        .navbar {
            min-height: 70px;
            background-color: #FFB7A7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #222;
            text-decoration: none;
        }

        .navbar nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar nav a {
            color: #222;
            text-decoration: none;
            font-weight: 500;
        }

        .navbar nav a:hover {
            text-decoration: underline;
        }

        .login-button {
            background-color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .saved-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 20px 70px;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-heading h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777;
            line-height: 1.5;
        }

        .saved-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }

        .saved-school-card {
            background-color: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;
        }

        .school-content {
            padding: 20px;

            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .school-content h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .school-location {
            color: #777;
            margin-bottom: 15px;
        }

        .school-description {
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .school-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .school-button {
            border: none;
            border-radius: 9px;

            padding: 11px 15px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
            text-align: center;
        }

        .website-button {
            background-color: #FFB7A7;
            color: #222;
            flex: 1;
        }

        .remove-button {
            background-color: #eee;
            color: #444;
        }

        .remove-button:hover {
            background-color: #ddd;
        }

        .message-box {
            grid-column: 1 / -1;

            background-color: white;

            padding: 50px 25px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .message-box h2 {
            margin-bottom: 10px;
        }

        .message-box p {
            color: #777;
            margin-bottom: 20px;
        }

        .message-box a {
            display: inline-block;

            background-color: #FFB7A7;
            color: #222;

            padding: 12px 20px;

            border-radius: 9px;

            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 18px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .navbar nav {
                width: 100%;
                flex-wrap: wrap;
                gap: 12px;
            }

            .navbar nav a {
                font-size: 13px;
            }

            .saved-page {
                padding: 30px 15px 50px;
            }

            .page-heading h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            EduMatch
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="map.html">
                Map
            </a>

            <a href="swipe.html">
                Swipe
            </a>

            <a href="saved.html">
                Saved Schools
            </a>

            <a href="about.html">
                About
            </a>

            <a
                href="login.html"
                class="login-button"
            >
                Login
            </a>

        </nav>

    </header>


    <main class="saved-page">

        <section class="page-heading">

            <h1>
                Saved Schools
            </h1>

            <p>
                These are the schools you swiped right on.
            </p>

        </section>


        <section
            id="saved-schools"
            class="saved-grid"
        >

            <div class="message-box">

                <h2>
                    Loading...
                </h2>

                <p>
                    Getting your saved schools.
                </p>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           SUPABASE
           ========================= */

        const SUPABASE_URL =
            "YOUR_SUPABASE_URL";

        const SUPABASE_ANON_KEY =
            "YOUR_SUPABASE_ANON_KEY";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        const savedSchoolsContainer =
            document.getElementById(
                "saved-schools"
            );


        /* =========================
           ESCAPE TEXT
           ========================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        /* =========================
           MESSAGE
           ========================= */

        function showMessage(
            title,
            message,
            buttonText = "",
            buttonLink = ""
        ) {

            savedSchoolsContainer.innerHTML =
                `
                <div class="message-box">

                    <h2>
                        ${escapeHTML(title)}
                    </h2>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    ${
                        buttonText && buttonLink
                            ?
                            `
                            <a href="${buttonLink}">
                                ${escapeHTML(buttonText)}
                            </a>
                            `
                            :
                            ""
                    }

                </div>
                `;
        }


        /* =========================
           GET USER
           ========================= */

        async function getCurrentUser() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getUser();

            if (error) {

                console.error(
                    "User error:",
                    error
                );

                return null;
            }

            return data.user;
        }


        /* =========================
           LOAD SAVED SCHOOLS
           ========================= */

        async function loadSavedSchools() {

            const user =
                await getCurrentUser();


            if (!user) {

                showMessage(
                    "Login Required",
                    "Please log in to view your saved schools.",
                    "Log In",
                    "login.html"
                );

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient

                    .from(
                        "saved_schools"
                    )

                    .select(
                        `
                        id,
                        school_id,
                        created_at,

                        schools (
                            school_id,
                            name,
                            description,
                            address,
                            state,
                            website
                        )
                        `
                    )

                    .eq(
                        "user_id",
                        user.id
                    )

                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Saved schools error:",
                    error
                );

                showMessage(
                    "Could not load schools",
                    "There was a problem loading your saved schools."
                );

                return;
            }


            if (
                !data ||
                data.length === 0
            ) {

                showMessage(
                    "No Saved Schools Yet",
                    "Swipe right on schools to save them here.",
                    "Start Swiping",
                    "swipe.html"
                );

                return;
            }


            savedSchoolsContainer.innerHTML =
                "";


            data.forEach(
                function(savedItem) {

                    const school =
                        savedItem.schools;


                    if (!school) {
                        return;
                    }


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "saved-school-card";


                    const name =
                        escapeHTML(
                            school.name ||
                            "Unnamed School"
                        );


                    const description =
                        escapeHTML(
                            school.description ||
                            "No description available."
                        );


                    const address =
                        escapeHTML(
                            school.address ||
                            ""
                        );


                    const state =
                        escapeHTML(
                            school.state ||
                            ""
                        );


                    const website =
                        school.website || "";


                    card.innerHTML =
                        `
                        <div class="school-content">

                            <h2>
                                ${name}
                            </h2>

                            <p class="school-location">

                                ${address}

                                ${
                                    address && state
                                        ? " • "
                                        : ""
                                }

                                ${state}

                            </p>

                            <p class="school-description">
                                ${description}
                            </p>

                            <div class="school-actions">

                                ${
                                    website
                                        ?
                                        `
                                        <a
                                            href="${escapeHTML(website)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            class="
                                                school-button
                                                website-button
                                            "
                                        >
                                            View Website
                                        </a>
                                        `
                                        :
                                        ""
                                }

                                <button
                                    type="button"
                                    class="
                                        school-button
                                        remove-button
                                    "
                                    data-saved-id="${savedItem.id}"
                                >
                                    Remove
                                </button>

                            </div>

                        </div>
                        `;


                    savedSchoolsContainer
                        .appendChild(
                            card
                        );
                }
            );


            document
                .querySelectorAll(
                    ".remove-button"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const savedId =
                                    button.dataset.savedId;

                                await removeSavedSchool(
                                    savedId
                                );
                            }
                        );

                    }
                );
        }


        /* =========================
           REMOVE SCHOOL
           ========================= */

        async function removeSavedSchool(
            savedId
        ) {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } =
                await supabaseClient

                    .from(
                        "saved_schools"
                    )

                    .delete()

                    .eq(
                        "id",
                        savedId
                    )

                    .eq(
                        "user_id",
                        user.id
                    );


            if (error) {

                console.error(
                    "Remove error:",
                    error
                );

                alert(
                    "Could not remove this school."
                );

                return;
            }


            loadSavedSchools();
        }


        /* =========================
           START
           ========================= */

        loadSavedSchools();

    </script>

</body>

</html>
